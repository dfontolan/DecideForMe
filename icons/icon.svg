<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- App Icon Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="55%" stop-color="#151822" />
      <stop offset="100%" stop-color="#0f1117" />
    </linearGradient>

    <!-- Outer Flame Gradient (Deep Red-Orange to Vibrant Orange) -->
    <linearGradient id="flameOuter" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="85%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Mid Flame Gradient (Vibrant Orange to Warm Amber-Yellow) -->
    <linearGradient id="flameMid" x1="20%" y1="85%" x2="80%" y2="15%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Inner Flame Core Gradient (Bright Golden Yellow) -->
    <linearGradient id="flameInner" x1="25%" y1="85%" x2="75%" y2="20%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Subtle Ambient Fire Glow -->
    <radialGradient id="fireGlow" cx="54%" cy="48%" r="46%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.32" />
      <stop offset="65%" stop-color="#ea580c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f1117" stop-opacity="0" />
    </radialGradient>

    <!-- Dice Face Gradients -->
    <linearGradient id="dieWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="dieMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="dieGrey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Rounded Square App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#f97316" stroke-opacity="0.35" stroke-width="6" />
  <circle cx="268" cy="250" r="225" fill="url(#fireGlow)" />

  <!-- ==================== BACK / MAIN FLAMES ==================== -->
  <g stroke="#111318" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- Main Outer Flame Silhouette -->
    <path
      d="M 102 286
         C 82 242, 100 184, 148 164
         C 146 132, 168 94, 212 72
         C 198 106, 206 124, 224 128
         C 242 86, 294 58, 344 36
         C 326 68, 326 88, 344 92
         C 382 54, 424 62, 464 34
         C 442 74, 444 104, 412 126
         C 394 138, 386 154, 404 176
         C 424 202, 396 244, 360 252
         C 386 248, 428 216, 448 182
         C 436 226, 420 264, 390 288
         C 378 298, 386 322, 358 338
         C 344 346, 330 336, 328 318
         C 304 338, 286 352, 292 372
         C 322 360, 358 378, 388 350
         C 376 388, 348 424, 314 432
         C 298 436, 298 456, 276 468
         C 254 480, 232 458, 234 440
         C 226 456, 256 464, 284 446
         C 256 488, 204 496, 178 468
         C 166 454, 174 432, 190 422
         C 144 402, 114 346, 102 286 Z"
      fill="url(#flameOuter)"
    />
  </g>

  <!-- Mid & Inner Flame Layers (No dark stroke for smooth fiery depth) -->
  <path
    d="M 122 274
       C 108 236, 124 192, 162 176
       C 162 146, 182 114, 214 96
       C 206 120, 218 138, 236 138
       C 254 102, 296 76, 332 58
       C 320 84, 326 102, 346 104
       C 378 76, 412 80, 442 58
       C 424 88, 424 110, 396 128
       C 372 144, 372 166, 386 184
       C 402 206, 378 238, 344 246
       C 376 248, 404 232, 422 208
       C 410 242, 396 270, 372 288
       C 360 298, 366 318, 346 326
       C 324 312, 282 336, 278 368
       C 308 368, 342 380, 366 364
       C 352 394, 328 418, 298 424
       C 282 428, 280 448, 260 456
       C 230 470, 192 478, 186 456
       C 182 440, 200 434, 212 422
       C 162 396, 134 330, 122 274 Z"
    fill="url(#flameMid)"
  />

  <path
    d="M 148 258
       C 142 222, 162 192, 192 176
       C 194 148, 218 126, 246 116
       C 264 96, 304 82, 328 74
       C 322 96, 334 112, 354 112
       C 378 92, 402 94, 420 82
       C 406 108, 396 126, 374 144
       C 354 160, 358 184, 368 202
       C 380 222, 358 250, 330 260
       C 360 264, 384 252, 396 238
       C 384 268, 368 292, 346 308
       C 312 330, 292 378, 342 376
       C 328 398, 302 414, 276 418
       C 242 424, 206 446, 200 458
       C 178 408, 154 316, 148 258 Z"
    fill="url(#flameInner)"
    opacity="0.88"
  />

  <!-- ==================== UPPER DIE (Showing 2, 6, 3) ==================== -->
  <g stroke="#111318" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- Left Shaded Face (2 pips) -->
    <path
      d="M 164 196
         L 254 128
         Q 264 122, 264 134
         L 266 244
         Q 266 254, 256 260
         L 168 318
         Q 158 322, 158 310
         L 156 210
         Q 156 202, 164 196 Z"
      fill="url(#dieGrey)"
    />
    <!-- Right Main Face (6 pips) -->
    <path
      d="M 264 128
         L 368 158
         Q 380 162, 382 176
         L 388 274
         Q 388 288, 376 292
         L 266 254
         L 264 128 Z"
      fill="url(#dieWhite)"
    />
    <!-- Bottom Visible Face (3 pips) -->
    <path
      d="M 164 316
         L 262 254
         L 378 290
         Q 384 296, 372 304
         L 272 364
         Q 258 370, 244 364
         L 164 316 Z"
      fill="url(#dieMid)"
    />
  </g>

  <!-- Upper Die Pips -->
  <g fill="#111318">
    <!-- Left Face (2 pips) -->
    <ellipse cx="192" cy="218" rx="13" ry="17" transform="rotate(28 192 218)" />
    <ellipse cx="236" cy="242" rx="13" ry="17" transform="rotate(28 236 242)" />

    <!-- Right Face (6 pips - 2 rows of 3) -->
    <ellipse cx="292" cy="168" rx="13" ry="17" transform="rotate(-18 292 168)" />
    <ellipse cx="326" cy="178" rx="13" ry="17" transform="rotate(-18 326 178)" />
    <ellipse cx="358" cy="188" rx="13" ry="17" transform="rotate(-18 358 188)" />

    <ellipse cx="294" cy="232" rx="13" ry="17" transform="rotate(-18 294 232)" />
    <ellipse cx="328" cy="242" rx="13" ry="17" transform="rotate(-18 328 242)" />
    <ellipse cx="360" cy="252" rx="13" ry="17" transform="rotate(-18 360 252)" />

    <!-- Bottom Face (3 pips) -->
    <ellipse cx="284" cy="284" rx="16" ry="10" transform="rotate(-8 284 284)" />
    <ellipse cx="334" cy="298" rx="16" ry="10" transform="rotate(-8 334 298)" />
    <ellipse cx="292" cy="326" rx="15" ry="10" transform="rotate(-8 292 326)" />
  </g>

  <!-- Overlapping Flame Lick On Upper Die Left Face -->
  <path
    d="M 124 282
       C 106 244, 118 202, 152 184
       C 148 214, 166 226, 184 218
       C 208 206, 224 180, 236 154
       C 234 190, 224 226, 202 252
       C 186 270, 156 286, 124 282 Z"
    fill="url(#flameOuter)"
    stroke="#111318"
    stroke-width="7"
    stroke-linejoin="round"
  />
  <path
    d="M 134 274
       C 122 244, 134 216, 158 204
       C 160 224, 180 232, 198 220
       C 210 210, 218 194, 224 180
       C 218 208, 206 234, 188 252
       C 172 268, 152 276, 134 274 Z"
    fill="url(#flameInner)"
  />

  <!-- ==================== LOWER DIE (Showing 5, 3, 1) ==================== -->
  <g stroke="#111318" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top Face (5 pips) -->
    <path
      d="M 80 332
         Q 72 322, 82 310
         L 150 248
         Q 162 238, 178 244
         L 262 276
         Q 274 282, 266 294
         L 196 360
         Q 184 370, 168 364
         L 80 332 Z"
      fill="url(#dieWhite)"
    />
    <!-- Left-Bottom Shaded Face (3 pips) -->
    <path
      d="M 76 328
         L 174 364
         Q 184 368, 188 380
         L 216 462
         Q 220 472, 208 468
         L 124 432
         Q 112 426, 106 412
         L 76 328 Z"
      fill="url(#dieGrey)"
    />
    <!-- Right Face (1 center pip) -->
    <path
      d="M 184 366
         L 268 288
         Q 276 282, 280 294
         L 308 378
         Q 312 394, 300 404
         L 224 466
         Q 216 472, 212 460
         L 184 366 Z"
      fill="url(#dieMid)"
    />
  </g>

  <!-- Lower Die Pips -->
  <g fill="#111318">
    <!-- Top Face (5 pips - Quincunx) -->
    <ellipse cx="164" cy="272" rx="17" ry="12" transform="rotate(-14 164 272)" />
    <ellipse cx="218" cy="290" rx="17" ry="12" transform="rotate(-14 218 290)" />
    <ellipse cx="172" cy="306" rx="17" ry="12" transform="rotate(-14 172 306)" />
    <ellipse cx="122" cy="316" rx="17" ry="12" transform="rotate(-14 122 316)" />
    <ellipse cx="178" cy="336" rx="17" ry="12" transform="rotate(-14 178 336)" />

    <!-- Left-Bottom Face (3 diagonal pips) -->
    <ellipse cx="110" cy="364" rx="17" ry="11" transform="rotate(26 110 364)" />
    <ellipse cx="146" cy="396" rx="17" ry="11" transform="rotate(26 146 396)" />
    <ellipse cx="182" cy="428" rx="17" ry="11" transform="rotate(26 182 428)" />

    <!-- Right Face (1 center pip) -->
    <ellipse cx="246" cy="378" rx="14" ry="18" transform="rotate(-18 246 378)" />
  </g>
</svg>
