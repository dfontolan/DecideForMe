<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="50%" stop-color="#171a24" />
      <stop offset="100%" stop-color="#0f1117" />
    </linearGradient>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="102" fill="none" stroke="#6366f1" stroke-opacity="0.35" stroke-width="8" />

  <!-- Tilted Dice Body -->
  <g transform="translate(244, 248) rotate(-8) translate(-150, -150)">
    <rect x="0" y="0" width="300" height="300" rx="64" fill="url(#diceGrad)" />
    <rect x="6" y="6" width="288" height="288" rx="58" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6" />

    <!-- Dice Pips (5 pattern) -->
    <circle cx="82" cy="82" r="24" fill="#ffffff" />
    <circle cx="218" cy="82" r="24" fill="#ffffff" />
    <circle cx="150" cy="150" r="26" fill="#ffffff" />
    <circle cx="82" cy="218" r="24" fill="#ffffff" />
    <circle cx="218" cy="218" r="24" fill="#ffffff" />
  </g>

  <!-- Completed Check Badge (Bottom-Right Corner) -->
  <g transform="translate(372, 372)">
    <circle cx="0" cy="0" r="76" fill="#0f1117" />
    <circle cx="0" cy="0" r="64" fill="url(#badgeGrad)" />
    <path d="M -26 2 L -8 20 L 28 -18" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
